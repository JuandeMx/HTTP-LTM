apply plugin: 'com.android.library'

android {
    namespace 'com.slipkprojects.ultrasshservice'
    compileSdk 34

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        buildConfig true
        aidl true
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }
    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    
	//api fileTree(dir: 'libs', include: ['*.jar'])
	
	/*api ('android.arch.core:runtime:+') {
        force = true
    }*/
	
	implementation 'com.android.support:appcompat-v7:25.+'
	
	//api 'org.connectbot:sshlib:2.2.9'
	//api 'com.github.SandroMachado:AndroidTampering:1.0.3'
	//api 'com.jcraft:jsch:0.1.54'
	//api 'com.jcraft:jzlib:1.0.7'
	
	//compile("com.jcraft:jzlib:1.1.3")
    //api 'org.connectbot:simplesocks:1.0.1'
	
    implementation 'net.i2p.crypto:eddsa:0.3.0'
	implementation 'org.connectbot:jbcrypt:1.0.2'
	//api 'com.madgag.spongycastle:core:1.58.0.0'
	
	// root detect
	implementation 'com.scottyab:rootbeer-lib:0.1.1'
	
	//api 'com.github.hussainderry:secure-preferences:4.0.0'
	
	implementation project(':libtunnel')
	api project(':style')

	
}
